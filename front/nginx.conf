server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: любые маршруты react-router (deep-link /projects/:cat/:sub и т.п.)
    # отдаём через index.html, а реальные файлы — как есть.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем — чтобы новые сборки подхватывались сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
