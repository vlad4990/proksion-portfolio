services:
  # ── Edge: единый Caddy (TLS + роутинг + вшитая статика front и admin) ──
  # Заменяет прежний сервис `front`. Multi-stage Dockerfile (контекст = корень репо)
  # собирает front → /srv и admin → /srv/admin и вшивает их в образ caddy:2-alpine.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: proksion-caddy:latest
    environment:
      # Прод: домен → Caddy сам выпустит и продлит HTTPS (Let's Encrypt).
      # Локально: SITE_ADDRESS=:80 в .env → Caddy отдаёт обычный HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Сертификаты и состояние Caddy переживают пересоздание контейнера —
      # иначе при каждом перезапуске будет заново долбиться в Let's Encrypt (есть лимиты).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      back:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Бэкенд (Bun + ElysiaJS). В задаче 01 — заглушка с GET /health. ──
  # Наружу НЕ публикуется: Caddy ходит на back:3001 по имени сервиса (/api/* → handle_path).
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: proksion-back:latest
    environment:
      BACK_PORT: ${BACK_PORT:-3001}
      DATABASE_PATH: ${DATABASE_PATH:-/data/db.sqlite}
      # Авторизация админки (задача 05). Секреты — только через .env, не в образ.
      # Пока JWT_SECRET/ADMIN_PASSWORD_HASH пусты — логин отклоняется (auth выключен, back стартует).
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-7200}
      # Secure-cookie: true на проде (HTTPS). Для локального прод-подобного прогона по HTTP → false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_LOGIN_MAX: ${AUTH_LOGIN_MAX:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-5}
      # MinIO — бэкенд ходит на minio:9000 по имени сервиса (S3-клиент + restore-синк картинок).
      # S3_ACCESS_KEY — ОТДЕЛЬНЫЙ app-ключ (не root); заводится сервисом minio-init и ограничен
      # бакетом media (§10). Root-креды (MINIO_ROOT_*) в back НЕ передаются.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-proksion-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-please-app}
      # Off-site бэкап (задача 11, §9). ТОКЕН ОБЛАКА — в rclone.conf (volume ниже), не здесь.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DEBOUNCE_MINUTES: ${BACKUP_DEBOUNCE_MINUTES:-10}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-cloud:proksion}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/config/rclone.conf}
      BACKUP_HISTORY_KEEP: ${BACKUP_HISTORY_KEEP:-14}
    volumes:
      # SQLite + стейдж бэкапа (DATABASE_PATH=/data/db.sqlite, снимок в /data/backup-stage — §9).
      - app_data:/data
      # rclone.conf (токен облака) — read-only volume. Токен облака живёт ТОЛЬКО здесь: не в
      # образе и не в репозитории (§10). Готовится один раз на сервере — см. docs/deploy.md.
      - rclone_config:/config:ro
    depends_on:
      # restore-on-boot синкает картинки в MinIO — ждём его готовности (§9).
      minio:
        condition: service_healthy
      # Ждём, пока minio-init заведёт app-ключ и бакет — back ходит в MinIO НЕ под root (§10).
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3001/health').catch(() => null); process.exit(r && r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── MinIO (S3-совместимое хранилище картинок). ──
  # Консоль (:9001) и API (:9000) наружу НЕ публикуются — портов нет вовсе, только внутренняя
  # сеть compose; картинки наружу отдаёт Caddy через /media/* → minio:9000 (§10).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      # Root-креды MinIO. Используются ТОЛЬКО minio-init'ом для провижининга; back под root НЕ ходит.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-proksion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MinIO provisioning (одноразовый job, НЕ рантайм-сервис). ──
  # Заводит НЕ-root app-ключ для бэкенда (S3_ACCESS_KEY/S3_SECRET_KEY) с политикой, ограниченной
  # бакетом media, и создаёт сам бакет (§10). Отрабатывает и завершается (restart: "no"), после
  # чего back стартует (depends_on: service_completed_successfully). В `docker compose ps` (без -a)
  # не отображается — рантайм остаётся ровно caddy+back+minio, простаивающих контейнеров нет.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-proksion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-proksion-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-please-app}
    entrypoint: ["/bin/sh", "-c"]
    # $$ → литеральный $ в шелле (compose иначе попытается подставить свою переменную).
    # Идемпотентно: user add / policy create / attach обёрнуты в `|| true` (повторный up не падает).
    command:
      - |
        set -e
        mc alias set mn http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing mn/"$$S3_BUCKET"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/app-policy.json
        mc admin user add mn "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || true
        mc admin policy create mn proksion-app /tmp/app-policy.json || true
        mc admin policy attach mn proksion-app --user "$$S3_ACCESS_KEY" 2>/dev/null || mc admin policy set mn proksion-app user="$$S3_ACCESS_KEY" || true
        echo "[minio-init] ok: bucket $$S3_BUCKET + non-root app user $$S3_ACCESS_KEY scoped to bucket"
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  minio_data:
  app_data:
  # rclone.conf с токеном облака. Готовится один раз (см. docs/deploy.md, back/src/backup/README.md)
  # и живёт только на сервере (монтируется в back как /config:ro) — в репозиторий/образ не попадает.
  rclone_config:
