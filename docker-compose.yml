services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: proksion-front:latest
    ports:
      - "${FRONT_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

