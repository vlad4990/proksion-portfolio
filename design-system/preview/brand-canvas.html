<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:0;color:var(--fg);overflow:hidden;height:100%;}
  .split{display:flex;height:100%;}
  .pane{flex:1;position:relative;display:flex;align-items:flex-end;padding:18px 22px;box-sizing:border-box;}
  .canvas{background:#141414;}
  /* Skeleton — white at 10% opacity, sitting on the canvas */
  .skeleton{background:#141414;}
  .skeleton::before{
    content:"";
    position:absolute;
    left:22px;top:22px;right:22px;bottom:64px;
    background:rgba(255,255,255,0.10);
  }
  .label{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:11px;
    color:#e4e4e4;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .label small{display:block;opacity:.55;font-size:10px;margin-top:2px;letter-spacing:.04em;}
</style></head><body>
<div class="split">
  <div class="pane canvas">
    <div class="label">canvas<small>#141414 · solid, full-bleed</small></div>
  </div>
  <div class="pane skeleton">
    <div class="label">skeleton<small>rgba(255,255,255,0.10)</small></div>
  </div>
</div>
</body></html>
