<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:32px;color:var(--fg);overflow:hidden;}
  .stack{display:flex;flex-direction:column;gap:22px;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .label{font-family:var(--font-body);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);width:90px;flex-shrink:0;}
  .meta{font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--fg-muted);opacity:.6;text-align:right;width:120px;flex-shrink:0;}
  .sample{flex:1;color:var(--fg-strong);line-height:1;letter-spacing:.02em;font-weight:700;text-transform:uppercase;}
  .s-display{font-family:'Stengazeta',sans-serif;font-size:64px;}
  .s-body{font-family:'Kanit',sans-serif;font-size:30px;text-transform:none;color:var(--fg);}
</style></head><body>
<div class="stack">
  <div class="row">
    <div class="label">Display</div>
    <div class="sample s-display">PROKSION</div>
    <div class="meta">Stengazeta</div>
  </div>
  <div class="row">
    <div class="label">Body</div>
    <div class="sample s-body">Графический дизайнер</div>
    <div class="meta">Kanit 700</div>
  </div>
</div>
</body></html>
