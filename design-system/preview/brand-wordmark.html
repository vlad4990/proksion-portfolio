<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:32px;color:var(--fg);overflow:hidden;height:100%;box-sizing:border-box;display:flex;align-items:center;}
  .word{font-family:'Stengazeta','Oswald',sans-serif;color:var(--accent);text-transform:uppercase;font-weight:700;font-size:96px;letter-spacing:.04em;line-height:1;}
  .meta{margin-left:32px;font-family:'Kanit','Manrope',sans-serif;font-weight:700;font-size:12px;color:var(--fg-muted);line-height:1.4;max-width:200px;}
  .meta .k{color:var(--accent);text-transform:uppercase;letter-spacing:.04em;font-size:11px;display:block;margin-bottom:6px;}
</style></head><body>
<div class="word">PROKSION</div>
<div class="meta">
  <span class="k">Wordmark</span>
  Stengazeta (sub: Oswald 700) · 100px · #a62323 · uppercase Latin. No glyph mark. Always paired with the year on its own row.
</div>
</body></html>
