<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:32px;color:var(--fg-strong);}
  table{width:100%;border-collapse:collapse;font-family:var(--font-body);font-weight:700;font-size:14px;}
  td{padding:10px 0;border-bottom:1px solid #1e1e1e;vertical-align:middle;}
  td.k{color:var(--accent);width:200px;text-transform:uppercase;letter-spacing:.04em;font-size:13px;}
  td.v{color:var(--fg-muted);font-size:13px;}
  td.sw{width:40px;}
  .swatch{width:24px;height:24px;display:inline-block;vertical-align:middle;}
</style></head><body>
<table>
  <tr><td class="sw"><span class="swatch" style="background:#141414;outline:1px solid #2a2a2a"></span></td><td class="k">--bg</td><td class="v">ink 1000 — page canvas</td></tr>
  <tr><td class="sw"><span class="swatch" style="background:#434145"></span></td><td class="k">--bg-panel</td><td class="v">ink 700 — hero photo column</td></tr>
  <tr><td class="sw"><span class="swatch" style="background:#c4c4c4"></span></td><td class="k">--fg</td><td class="v">paper 500 — body copy</td></tr>
  <tr><td class="sw"><span class="swatch" style="background:#e4e4e4"></span></td><td class="k">--fg-strong</td><td class="v">paper 300 — display headlines</td></tr>
  <tr><td class="sw"><span class="swatch" style="background:#a62323"></span></td><td class="k">--accent</td><td class="v">red 500 — wordmark, active state, emphasis</td></tr>
  <tr><td class="sw"><span class="swatch" style="background:rgba(166,35,35,.7)"></span></td><td class="k">--accent-dim</td><td class="v">red α70 — secondary / previous</td></tr>
  <tr><td class="sw"><span class="swatch" style="background:#e4e4e4"></span></td><td class="k">--pill</td><td class="v">paper 300 — nav active background</td></tr>
</table>
</body></html>
