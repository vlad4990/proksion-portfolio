<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:24px;color:var(--fg);}
  .row{display:flex;gap:0;align-items:stretch;}
  .sw{flex:1;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;font-family:var(--font-body);font-size:12px;font-weight:700;line-height:1.2;}
  .sw .name{font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
  .sw .hex{opacity:.7;font-size:11px;}
  .sw.dark{color:#fff;} .sw.light{color:#141414;}
</style></head><body>
<div class="row">
  <div class="sw dark" style="background:#a62323;flex:2.4;"><div class="name">red 500 · accent</div><div class="hex">#a62323</div></div>
  <div class="sw dark" style="background:rgba(166,35,35,0.7);flex:1.3;"><div class="name">red α70 · dim</div><div class="hex">rgba(166,35,35,.7)</div></div>
  <div class="sw dark" style="background:#9e2b0a;flex:1;"><div class="name">red 600 · warm</div><div class="hex">#9e2b0a</div></div>
  <div class="sw dark" style="background:#b11d47;flex:1;"><div class="name">red 700 · cool</div><div class="hex">#b11d47</div></div>
</div>
</body></html>
