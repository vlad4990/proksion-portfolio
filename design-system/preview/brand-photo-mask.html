<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:24px 32px;color:var(--fg);overflow:hidden;height:100%;box-sizing:border-box;display:flex;align-items:center;gap:32px;}
  .frame{display:flex;align-items:center;justify-content:center;height:240px;}
  .frame img{display:block;max-height:100%;width:auto;}
  .meta{font-family:'Kanit',sans-serif;font-weight:700;font-size:12px;color:var(--fg-muted);line-height:1.4;max-width:240px;}
  .meta .k{color:var(--accent);text-transform:uppercase;letter-spacing:.04em;font-size:11px;display:block;margin-bottom:6px;}
</style></head><body>
<div class="frame"><img src="../assets/photo-masked-1.png" alt=""></div>
<div class="frame"><img src="../assets/photo-masked-2.png" alt=""></div>
<div class="meta">
  <span class="k">Mask-clipped imagery</span>
  Маска запекается прямо в PNG-экспорт из Figma. Никакого CSS-маскинга — просто <code style="color:var(--fg-muted)">&lt;img&gt;</code> с прозрачным фоном. Экспортируем в @2x.
</div>
</body></html>
