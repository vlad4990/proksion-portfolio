<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:24px;color:var(--fg);}
  .row{display:flex;gap:0;}
  .sw{flex:1;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-family:var(--font-body);font-size:12px;font-weight:700;line-height:1.2;border-right:1px solid #0a0e15;}
  .sw .name{font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
  .sw .hex{opacity:.7;font-size:11px;}
  .sw.dark{color:#e4e4e4;}
</style></head><body>
<div class="row">
  <div class="sw dark" style="background:#141414;"><div class="name">ink 1000 · canvas</div><div class="hex">#141414</div></div>
  <div class="sw dark" style="background:#0a0e15;"><div class="name">ink 900 · inset</div><div class="hex">#0a0e15</div></div>
  <div class="sw dark" style="background:#1e1e1e;"><div class="name">ink 800 · hover</div><div class="hex">#1e1e1e</div></div>
  <div class="sw dark" style="background:#434145;"><div class="name">ink 700 · panel</div><div class="hex">#434145</div></div>
  <div class="sw dark" style="background:#292c40;"><div class="name">ink 500 · slate</div><div class="hex">#292c40</div></div>
</div>
</body></html>
