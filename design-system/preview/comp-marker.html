<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:32px;color:var(--fg);overflow:hidden;font-family:'Kanit',sans-serif;}
  .wrap{display:flex;gap:80px;align-items:center;}
  .item{display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
  .icon-box{width:56px;height:56px;display:flex;align-items:center;justify-content:center;}
  .icon-box img{display:block;}
  .label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .v{font-size:13px;font-weight:700;color:var(--fg-muted);max-width:200px;line-height:1.3;}
  .v small{display:block;opacity:.6;font-size:10px;margin-top:4px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;}
</style></head><body>
<div class="wrap">
  <div class="item">
    <div class="icon-box"><img src="../assets/icon-marker-pixel.svg" width="24" height="29" alt=""></div>
    <div class="label">Play · collapsed</div>
    <div class="v">Указывает на свёрнутую секцию. <small>Натуральная ориентация SVG</small></div>
  </div>
  <div class="item">
    <div class="icon-box"><img src="../assets/icon-marker-pixel.svg" width="24" height="29" alt="" style="transform:rotate(90deg);"></div>
    <div class="label">Play · expanded</div>
    <div class="v">Указывает на раскрытую секцию. <small>transform: rotate(90deg)</small></div>
  </div>
</div>
</body></html>
