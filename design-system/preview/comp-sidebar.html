<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:'Stengazeta',sans-serif;text-transform:uppercase;}
  /* Card simulates the left edge of the device — active bg bleeds to x=0. */
  .frame{padding:24px 0;}
  .tree{display:flex;flex-direction:column;width:380px;}

  /* Groups (root) start at x=48; the pixel triangle sits absolute left of the active group. */
  .group{position:relative;padding:0 0 0 48px;font-weight:700;font-size:30px;color:var(--fg-muted);letter-spacing:.04em;line-height:1;margin-bottom:18px;}
  .group.red{color:var(--accent);}
  .group .marker{position:absolute;left:32px;top:50%;transform:translateY(-50%);width:9px;height:11px;}

  /* Children indented slightly further than their parent (text starts at x=76). */
  .children{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .child{padding:7px 0 7px 76px;font-size:20px;color:var(--fg-muted);letter-spacing:.04em;}
  .child.active{background:#e4e4e4;color:#141414;border-radius:0 4px 4px 0;}

  .meta{margin:18px 32px 0;font-family:'Kanit',sans-serif;font-size:11px;color:var(--fg-muted);text-transform:none;letter-spacing:.02em;line-height:1.4;opacity:.75;}
  .meta b{color:var(--accent);}
</style></head><body>
<div class="frame">
  <div class="tree">
    <div class="group red">
      <img class="marker" src="../assets/icon-marker-pixel.svg" alt="">
      PRESS F
    </div>
    <div class="children">
      <div class="child">БАННЕРА</div>
      <div class="child active">ВИТРИНЫ ТОВАРОВ</div>
      <div class="child">ПОСТЫ В СОЦ.СЕТИ</div>
    </div>
    <div class="group">KUPIKOD</div>
  </div>
  <div class="meta">
    Подкатегории отступают <b>правее</b> своих родительских секций. У активной подкатегории белый фон уходит до левого края устройства, а сам текст выровнен с неактивными подкатегориями.
  </div>
</div>
</body></html>
