<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:32px;color:var(--fg);overflow:hidden;font-family:'Kanit','Manrope',sans-serif;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .cell{display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
  .swatch{width:120px;height:60px;background:var(--c-paper-300);}
  .swatch.pill{border-radius:12px;}
  .swatch.card{border-radius:4px;}
  .swatch.tile{border-radius:0;}
  .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);}
  .v{font-size:12px;color:var(--fg-muted);font-weight:700;}
  .v small{opacity:.6;font-size:10px;display:block;}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="swatch tile"></div><div><div class="k">--radius-tile</div><div class="v">0 px<small>project tiles, panels, photos</small></div></div></div>
  <div class="cell"><div class="swatch card"></div><div><div class="k">--radius-card</div><div class="v">4 px<small>sidebar active row</small></div></div></div>
  <div class="cell"><div class="swatch pill"></div><div><div class="k">--radius-pill</div><div class="v">12 px<small>nav active pill only</small></div></div></div>
</div>
</body></html>
