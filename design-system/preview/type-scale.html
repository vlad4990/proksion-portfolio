<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:28px 32px;color:var(--fg);overflow:hidden;}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid #1e1e1e;padding:8px 0;}
  .row:last-child{border:0;}
  .size{font-family:'Kanit',sans-serif;font-weight:700;font-size:11px;color:var(--accent);width:70px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}
  .name{font-family:'Kanit',sans-serif;font-weight:700;font-size:11px;color:var(--fg-muted);opacity:.6;width:130px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;}
  .sample{font-family:'Stengazeta',sans-serif;color:var(--fg-strong);text-transform:uppercase;line-height:1;letter-spacing:.02em;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;}
</style></head><body>
  <div class="row">
    <div class="size">100 px</div>
    <div class="name">hero · wordmark</div>
    <div class="sample" style="font-size:60px;color:var(--accent)">PROKSION</div>
  </div>
  <div class="row">
    <div class="size">80 px</div>
    <div class="name">header-1 · section</div>
    <div class="sample" style="font-size:46px">ОПЫТ РАБОТЫ</div>
  </div>
  <div class="row">
    <div class="size">52 px</div>
    <div class="name">section · projects</div>
    <div class="sample" style="font-size:34px">SKETCHBOOK</div>
  </div>
  <div class="row">
    <div class="size">40 px</div>
    <div class="name">header-2 · sub-section</div>
    <div class="sample" style="font-size:28px">ГРАФИЧЕСКИЙ ДИЗАЙНЕР</div>
  </div>
  <div class="row">
    <div class="size">32 px</div>
    <div class="name">sub-section · projects</div>
    <div class="sample" style="font-size:22px">ВИТРИНЫ ТОВАРОВ</div>
  </div>
  <div class="row">
    <div class="size">22 px</div>
    <div class="name">body · Kanit 700</div>
    <div class="sample" style="font-family:'Kanit',sans-serif;font-size:18px;text-transform:none;color:var(--fg)">Работа с креативами: баннеры, посты</div>
  </div>
</body></html>
