<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:32px;color:var(--fg);overflow:hidden;height:100%;box-sizing:border-box;}
  .wrap{position:relative;display:flex;align-items:flex-start;}
  .stack{font-family:'Stengazeta','Black Ops One',sans-serif;color:#e4e4e4;-webkit-text-stroke:2.4px #000;font-size:220px;line-height:0.85;letter-spacing:.02em;text-transform:uppercase;}
  .meta{margin-left:32px;align-self:center;font-family:'Kanit','Manrope',sans-serif;font-weight:700;font-size:12px;color:var(--fg-muted);max-width:200px;line-height:1.4;}
  .meta .k{color:var(--accent);text-transform:uppercase;letter-spacing:.04em;font-size:11px;display:block;margin-bottom:6px;}
</style></head><body>
<div class="wrap">
  <div class="stack">PORT<br>FOLIO</div>
  <div class="meta">
    <span class="k">Outlined display</span>
    Off-white fill (#e4e4e4) with a ~2.4px pure-black stroke. Used only at hero scale (≥200px), only on dark canvas.
  </div>
</div>
</body></html>
