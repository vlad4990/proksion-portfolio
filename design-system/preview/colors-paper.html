<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:24px;color:var(--fg);}
  .row{display:flex;gap:0;}
  .sw{flex:1;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#141414;font-family:var(--font-body);font-size:12px;font-weight:700;line-height:1.2;border-right:1px solid #141414;}
  .sw .name{font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
  .sw .hex{opacity:.7;font-size:11px;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#fcfcfc;"><div class="name">paper 100</div><div class="hex">#fcfcfc</div></div>
  <div class="sw" style="background:#fdebc1;"><div class="name">paper 200 · cream</div><div class="hex">#fdebc1</div></div>
  <div class="sw" style="background:#e4e4e4;"><div class="name">paper 300 · display</div><div class="hex">#e4e4e4</div></div>
  <div class="sw" style="background:#d9d9d9;"><div class="name">paper 400</div><div class="hex">#d9d9d9</div></div>
  <div class="sw" style="background:#c4c4c4;"><div class="name">paper 500 · body</div><div class="hex">#c4c4c4</div></div>
  <div class="sw" style="background:#bfbfbf;"><div class="name">paper 600 · muted</div><div class="hex">#bfbfbf</div></div>
</div>
</body></html>
