<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:28px 32px;color:var(--fg);overflow:hidden;font-family:'Kanit','Manrope',sans-serif;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
  .token{width:80px;font-weight:700;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
  .px{width:46px;font-weight:700;font-size:11px;color:var(--fg-muted);opacity:.6;}
  .bar{height:14px;background:var(--accent);}
</style></head><body>
  <div class="row"><div class="token">--sp-1</div><div class="px">4 px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="token">--sp-2</div><div class="px">8 px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="token">--sp-3</div><div class="px">12 px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="token">--sp-4</div><div class="px">16 px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="token">--sp-5</div><div class="px">24 px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="token">--sp-6</div><div class="px">32 px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="token">--sp-7</div><div class="px">48 px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="token">--sp-8</div><div class="px">64 px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="token">--sp-9</div><div class="px">96 px</div><div class="bar" style="width:96px"></div></div>
  <div class="row"><div class="token">--sp-10</div><div class="px">128 px</div><div class="bar" style="width:128px"></div></div>
</body></html>
