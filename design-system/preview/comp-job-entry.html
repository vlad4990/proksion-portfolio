<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg);padding:28px 32px;color:var(--fg);overflow:hidden;}
  .entry{display:flex;flex-direction:column;gap:8px;}
  .head{display:flex;align-items:baseline;gap:28px;font-family:'Stengazeta','Oswald',sans-serif;text-transform:uppercase;font-weight:700;font-size:22px;letter-spacing:.04em;}
  .co{color:var(--accent);}
  .co.dim{color:rgba(166,35,35,.7);}
  .role{color:var(--fg-muted);}
  .dur{margin-left:auto;color:var(--fg-muted);font-size:18px;}
  ul{margin:6px 0 0 0;padding:0;list-style:none;font-family:'Kanit','Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--fg);line-height:1.4;}
  li{margin-bottom:4px;}
  .label{margin-top:14px;font-family:'Kanit','Manrope',sans-serif;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}

<div class="entry">
  <div class="head"><span class="co">LOFTY.</span><span class="role">ГРАФИЧЕСКИЙ ДИЗАЙНЕР</span><span class="dur">1.5 ГОДА</span></div>
  <ul>
    <li>Работа с креативами: баннеры, оформление smm-постов</li>
    <li>Обновление и формирование фирменного стиля для smm</li>
    <li>Работа с UI-kit компании, разработка макетов под ивенты</li>
  </ul>
</div>
<div class="label">Résumé entry · current role uses full-red · earlier roles use red α70</div>
</body></html>
