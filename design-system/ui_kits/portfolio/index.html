<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>PROKSION — Kristina · portfolio</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); overflow-x: hidden; }
    body { min-height: 100vh; }
    /* Stage scales the 1920-wide page to fit any viewport */
    .stage {
      width: 1920px;
      transform-origin: top left;
      margin: 0 auto;
    }
    /* Each screen is 1920 wide; height varies */
    .screen {
      position: relative;
      width: 1920px;
      background: var(--bg);
      overflow: hidden;
    }
    .screen.home { height: 1080px; }
    .screen.about { min-height: 1838px; }
    .screen.projects { min-height: 1865px; }

    /* Make text selection cosmetic */
    ::selection { background: var(--accent); color: var(--fg-strong); }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="TopNav.jsx"></script>
  <script type="text/babel" src="HeroScreen.jsx"></script>
  <script type="text/babel" src="AboutScreen.jsx"></script>
  <script type="text/babel" src="ProjectsScreen.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <script>
    // Fit-to-width scaling so the 1920 page works in any viewport
    function fit() {
      const stage = document.querySelector('.stage');
      if (!stage) { requestAnimationFrame(fit); return; }
      const scale = Math.min(1, window.innerWidth / 1920);
      stage.style.transform = `scale(${scale})`;
      // collapse the layout height to match the scaled content so the page
      // doesn't show a huge empty area below the scaled artwork.
      const screen = stage.querySelector('.screen');
      if (screen) {
        document.body.style.minHeight = (screen.getBoundingClientRect().height) + 'px';
      }
    }
    window.addEventListener('resize', fit);
    new MutationObserver(fit).observe(document.body, {childList:true, subtree:true});
    requestAnimationFrame(fit);
  </script>
</body>
</html>
