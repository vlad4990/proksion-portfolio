<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PROKSION — Kristina · портфолио</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      overflow-x: hidden;
    }
    body { min-height: 100vh; }

    /* ── Hero curtain ────────────────────────────────────────── */
    .hero-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg);
      overflow: hidden; cursor: pointer;
      transition: transform 0.55s cubic-bezier(.6,.05,.3,1);
      will-change: transform;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-overlay.dismissing { transform: translateY(-100%); pointer-events: none; }

    /* ── Desktop: 1920-px scaled stage ──────────────────────── */
    .hero-fit {
      width: 1920px; height: 1080px;
      transform-origin: center center;
      flex: 0 0 auto; position: relative;
    }
    .stage-wrap { position: relative; width: 100%; overflow: hidden; }
    .stage { width: 1920px; transform-origin: top left; }

    /* Fixed desktop top-bar */
    .nav-host {
      position: fixed; top: 0; left: 0;
      width: 1920px; height: 160px;
      transform-origin: top left;
      z-index: 100; pointer-events: none;
      background: var(--bg);
    }
    .nav-host > nav { pointer-events: auto; }

    ::selection { background: var(--accent); color: var(--fg-strong); }
    @keyframes pkBob {
      0%, 100% { transform: rotate(90deg) translateX(0); }
      50%      { transform: rotate(90deg) translateX(8px); }
    }

    /* ── Mobile overrides (≤ 768px) ─────────────────────────── */
    @media (max-width: 768px) {
      /* Hide the desktop scaled stage and nav-host */
      .stage-wrap, .nav-host { display: none !important; }
      /* hero-fit not used on mobile — MobileHero fills 100vw×100vh directly */
      .hero-fit { display: none; }

      /* Hero overlay on mobile: no flex centering needed */
      .hero-overlay {
        display: block;
        cursor: default;
      }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Desktop components -->
  <script type="text/babel" src="TopNav.jsx"></script>
  <script type="text/babel" src="HeroSection.jsx"></script>
  <script type="text/babel" src="AboutSection.jsx"></script>
  <script type="text/babel" src="ProjectsScreen.jsx"></script>

  <!-- Mobile components -->
  <script type="text/babel" src="MobileTabBar.jsx"></script>
  <script type="text/babel" src="MobileHero.jsx"></script>
  <script type="text/babel" src="MobileAbout.jsx"></script>
  <script type="text/babel" src="MobileProjects.jsx"></script>
  <script type="text/babel" src="MobileContacts.jsx"></script>

  <!-- App router (detects mobile, picks tree) -->
  <script type="text/babel" src="App.jsx"></script>

  <script>
    // Desktop-only: fit the 1920-px stage to viewport width.
    // On mobile (≤768px) native layout handles everything — bail out.
    let fitScheduled = false;
    function fit() {
      if (window.innerWidth <= 768) return; // mobile: no scaling needed
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = Math.min(1, vw / 1920);
      const t = `scale(${scale})`;

      const stage   = document.querySelector('.stage');
      const wrap    = document.querySelector('.stage-wrap');
      const navHost = document.querySelector('.nav-host');
      if (stage   && stage.style.transform   !== t) stage.style.transform   = t;
      if (navHost && navHost.style.transform !== t) navHost.style.transform = t;
      if (stage && wrap) {
        const h = (stage.scrollHeight * scale) + 'px';
        if (wrap.style.height !== h) wrap.style.height = h;
      }

      const heroFit = document.querySelector('.hero-fit');
      if (heroFit) {
        const ht = `scale(${Math.min(vw / 1920, vh / 1080)})`;
        if (heroFit.style.transform !== ht) heroFit.style.transform = ht;
      }
    }
    function scheduleFit() {
      if (fitScheduled) return;
      fitScheduled = true;
      requestAnimationFrame(() => { fitScheduled = false; fit(); });
    }
    window.addEventListener('resize', scheduleFit);
    new MutationObserver(scheduleFit).observe(document.body, { childList: true, subtree: true });
    requestAnimationFrame(fit);
  </script>
</body>
</html>
