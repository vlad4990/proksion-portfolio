<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Mobile mockup · 1:1</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    html, body { background: #f0eee9; margin: 0; padding: 0; }
    body {
      padding: 60px 40px;
      font-family: -apple-system, system-ui, sans-serif;
    }
    h1 {
      font-family: 'Stengazeta', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #1a1a1a;
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .lede {
      color: #555;
      font-size: 14px;
      max-width: 820px;
      line-height: 1.55;
      margin-bottom: 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, max-content);
      gap: 40px 48px;
      align-items: start;
    }
    .col { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .col-label {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      color: #4a4a4a;
      font-weight: 500;
    }
    .stengazeta { font-family: 'Stengazeta', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <h1>МОБАЙЛ · ВЫБРАННОЕ НАПРАВЛЕНИЕ</h1>
  <p class="lede">Hero (занавес) → ОБО МНЕ → ПРОЕКТЫ + КОНТАКТЫ. Навигация — фиксированный tab bar внизу с иконками и подписями в стиле бренда. На превью-экране tab bar намеренно отсутствует (это «заставка»).</p>

  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="variants.jsx"></script>
  <script type="text/babel" src="final-mock.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <div className="grid">
          <div className="col">
            <IOSDevice dark width={390} height={844}>
              <FM_Hero />
            </IOSDevice>
            <div className="col-label">01 · Hero (заставка)</div>
          </div>
          <div className="col">
            <IOSDevice dark width={390} height={844}>
              <FM_About />
            </IOSDevice>
            <div className="col-label">02 · Обо мне · активна вкладка</div>
          </div>
          <div className="col">
            <IOSDevice dark width={390} height={844}>
              <FM_Projects />
            </IOSDevice>
            <div className="col-label">03 · Проекты</div>
          </div>
          <div className="col">
            <IOSDevice dark width={390} height={844}>
              <FM_Contacts />
            </IOSDevice>
            <div className="col-label">04 · Контакты</div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
