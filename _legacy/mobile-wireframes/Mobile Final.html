<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Mobile final · Proksion (tab bar)</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { background: #f0eee9; }
    .stengazeta { font-family: 'Stengazeta', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <!-- variants.jsx exposes MaskedPlaceholder + Tile that final-mock.jsx reuses -->
  <script type="text/babel" src="variants.jsx"></script>
  <script type="text/babel" src="final-mock.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="final"
            title="Мобайл · финальное направление"
            subtitle="A-Hero (занавес) → A-About → B-Projects + новая страница КОНТАКТЫ. Навигация через bottom tab bar в брендовой ДНК: solid black, Stengazeta caps, красный пиксель-маркер как индикатор активной вкладки.">
            <DCArtboard id="hero" label="01 · Hero (занавес)" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <FM_Hero />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="about" label="02 · Обо мне" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <FM_About />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="projects" label="03 · Проекты" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <FM_Projects />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="contacts" label="04 · Контакты (new)" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <FM_Contacts />
              </IOSDevice>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
