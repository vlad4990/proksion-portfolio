<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Mobile wireframes — Proksion</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { background: #f0eee9; }
    /* Each phone frame's body uses the brand canvas */
    .ph {
      background: #141414;
      color: #bfbfbf;
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    .ph * { box-sizing: border-box; }
    .stengazeta { font-family: 'Stengazeta', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
    .red { color: #a62323; }
    .accent { color: #a62323; }
    .accent-dim { color: rgba(166,35,35,0.7); }
    .muted { color: #bfbfbf; }
    .strong { color: #e4e4e4; }
    /* Annotation rows */
    .note {
      padding: 10px 12px;
      background: rgba(0,0,0,0.04);
      border-radius: 6px;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: #3a342c;
      max-width: 380px;
    }
    .note b { color: #1c1812; }
    .note ul { margin: 6px 0 0 16px; padding: 0; }
    .note li { margin: 2px 0; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="variants.jsx"></script>
  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="A"
            title="Вариант A · Минимальный стек"
            subtitle="Дружелюбный к чтению, никаких сюрпризов. Шапка → бургер. Hero вертикальный. About — одна колонка. Projects — 2-кол. masonry + аккордеон категорий.">
            <DCArtboard id="A1" label="A · Hero (занавес)" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantA_Hero />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="A2" label="A · Обо мне" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantA_About />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="A3" label="A · Проекты" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantA_Projects />
              </IOSDevice>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="B"
            title="Вариант B · Редакционный фуллскрин"
            subtitle="Каждый раздел — отдельный полноэкранный «слайд» с горизонтальной/вертикальной навигацией. Категории — горизонтальные чипсы. Похоже на сторис, но без агрессии.">
            <DCArtboard id="B1" label="B · Hero" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantB_Hero />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="B2" label="B · Обо мне" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantB_About />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="B3" label="B · Проекты" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantB_Projects />
              </IOSDevice>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="C"
            title="Вариант C · Типографический плакат"
            subtitle="Раскачивает ДНК советского настенного плаката — гиперскейлы, переполнение, разорванные сетки. Проекты — лента в одну колонку, каждый кейс на полный экран. Smell of paper.">
            <DCArtboard id="C1" label="C · Hero" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantC_Hero />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="C2" label="C · Обо мне" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantC_About />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="C3" label="C · Проекты" width={402} height={874}>
              <IOSDevice dark width={402} height={874}>
                <VariantC_Projects />
              </IOSDevice>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
